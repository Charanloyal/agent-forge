services:
  - type: web
    name: agent-forge
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: QDRANT_HOST
        value: ":memory:"
      - key: LOG_LEVEL
        value: "INFO"
